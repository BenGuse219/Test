name: Deploy to AWS

on:
  push:
    branches:
      - main
      - master
      - claude/**
  workflow_dispatch: # Allow manual deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for OIDC authentication

    outputs:
      cloudfront_url: ${{ steps.get-url.outputs.cloudfront_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install CDK dependencies
        run: |
          cd infrastructure
          npm ci

      - name: Deploy to AWS
        run: cd infrastructure && npx cdk deploy --require-approval never
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Get CloudFront URL
        id: get-url
        run: |
          cd infrastructure
          CLOUDFRONT_URL=$(npx cdk deploy --outputs-file cdk-outputs.json --require-approval never 2>&1 | grep -oP 'https://[a-z0-9]+\.cloudfront\.net' | head -1)
          if [ -z "$CLOUDFRONT_URL" ]; then
            # Fallback: try to read from outputs file
            CLOUDFRONT_URL=$(cat cdk-outputs.json 2>/dev/null | grep -oP '"CloudFrontUrl":\s*"\K[^"]+' || echo "")
          fi
          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: $CLOUDFRONT_URL"

  test-production:
    needs: deploy
    runs-on: ubuntu-latest
    if: needs.deploy.outputs.cloudfront_url != ''

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for CloudFront to propagate
        run: |
          echo "Waiting 30 seconds for CloudFront to propagate..."
          sleep 30

      - name: Test production deployment
        run: npx playwright test --config=playwright.prod.config.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.cloudfront_url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
