name: Deploy to AWS

on:
  push:
    branches:
      - main
      - master
      - claude/**
  workflow_dispatch: # Allow manual deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write   # Required for OIDC authentication
      issues: write     # Required to create issues on failure

    outputs:
      cloudfront_url: ${{ steps.get-url.outputs.cloudfront_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install CDK dependencies
        run: |
          cd infrastructure
          npm ci

      - name: Deploy to AWS
        run: cd infrastructure && npx cdk deploy --require-approval never
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Get CloudFront URL
        id: get-url
        run: |
          cd infrastructure
          CLOUDFRONT_URL=$(npx cdk deploy --outputs-file cdk-outputs.json --require-approval never 2>&1 | grep -oP 'https://[a-z0-9]+\.cloudfront\.net' | head -1)
          if [ -z "$CLOUDFRONT_URL" ]; then
            # Fallback: try to read from outputs file
            CLOUDFRONT_URL=$(cat cdk-outputs.json 2>/dev/null | grep -oP '"CloudFrontUrl":\s*"\K[^"]+' || echo "")
          fi
          echo "cloudfront_url=$CLOUDFRONT_URL" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: $CLOUDFRONT_URL"

      - name: Create issue on deployment failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Deployment Failed - ${context.workflow} #${context.runNumber}`,
              body: `## Deployment Failure Report

            **Workflow**: ${context.workflow}
            **Run**: [#${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId})
            **Branch**: ${context.ref.replace('refs/heads/', '')}
            **Commit**: ${context.sha.substring(0, 7)}
            **Actor**: @${context.actor}

            ### Failure Details
            The deployment job failed. Check the [workflow logs](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.

            ### Quick Actions
            - 🔍 [View full logs](${context.payload.repository.html_url}/actions/runs/${context.runId})
            - 🔄 [Re-run workflow](${context.payload.repository.html_url}/actions/runs/${context.runId})

            ---
            *Auto-generated by GitHub Actions*`,
              labels: ['deployment-failure', 'automated']
            });
            console.log('Created issue:', issue.data.number);

  test-production:
    needs: deploy
    runs-on: ubuntu-latest
    if: needs.deploy.outputs.cloudfront_url != ''

    permissions:
      contents: write   # Required to commit screenshots
      issues: write     # Required to create issues on failure

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Wait for CloudFront to propagate
        run: |
          echo "Waiting 30 seconds for CloudFront to propagate..."
          sleep 30

      - name: Test production deployment
        run: npx playwright test --config=playwright.prod.config.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ needs.deploy.outputs.cloudfront_url }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit screenshots to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Add screenshots if any exist
          if [ -d "screenshots" ] && [ "$(ls -A screenshots 2>/dev/null)" ]; then
            git add screenshots/

            # Only commit if there are changes
            if ! git diff --staged --quiet; then
              git commit -m "📸 Update production screenshots from test run #${{ github.run_number }}

              Automated screenshot update from production tests
              Deployed URL: ${{ needs.deploy.outputs.cloudfront_url }}
              Workflow: ${{ github.workflow }}
              Run: ${{ github.run_number }}"

              git push
              echo "✅ Screenshots committed and pushed"
            else
              echo "ℹ️  No screenshot changes to commit"
            fi
          else
            echo "ℹ️  No screenshots directory found"
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Create issue on test failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🧪 Production Tests Failed - ${context.workflow} #${context.runNumber}`,
              body: `## Production Test Failure Report

            **Workflow**: ${context.workflow}
            **Run**: [#${context.runNumber}](${context.payload.repository.html_url}/actions/runs/${context.runId})
            **Branch**: ${context.ref.replace('refs/heads/', '')}
            **Deployed URL**: ${{ needs.deploy.outputs.cloudfront_url }}
            **Actor**: @${context.actor}

            ### Test Failure
            Production tests failed on the deployed site. This could indicate:
            - CSS/styling issues
            - Functionality problems
            - API/backend errors
            - CloudFront/Lambda issues

            ### Quick Actions
            - 🔍 [View test logs](${context.payload.repository.html_url}/actions/runs/${context.runId})
            - 📊 [Download test report](${context.payload.repository.html_url}/actions/runs/${context.runId}#artifacts)
            - 🌐 [Test deployed site](${{ needs.deploy.outputs.cloudfront_url }})

            ---
            *Auto-generated by GitHub Actions*`,
              labels: ['test-failure', 'automated', 'css-check']
            });
            console.log('Created issue:', issue.data.number);
