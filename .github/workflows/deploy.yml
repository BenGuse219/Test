name: Deploy to AWS

on:
  push:
    branches:
      - main
      - master
      - claude/**
  workflow_dispatch: # Allow manual deployment

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/claude/')

    permissions:
      contents: read
      id-token: write   # Required for OIDC authentication

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Verify AWS Connection
        run: aws sts get-caller-identity

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Install CDK dependencies
        run: |
          cd infrastructure
          npm ci

      - name: Deploy to AWS
        run: npm run cdk:deploy -- --require-approval never
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Get deployment outputs
        id: outputs
        run: |
          cd infrastructure
          echo "cloudfront_url=$(npx cdk deploy --outputs-file outputs.json 2>&1 | grep CloudFrontUrl | cut -d '=' -f2 | tr -d ' ')" >> $GITHUB_OUTPUT

      - name: Comment deployment URL
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Deployment successful!\n\nYour app is live at: ${{ steps.outputs.outputs.cloudfront_url }}'
            })
